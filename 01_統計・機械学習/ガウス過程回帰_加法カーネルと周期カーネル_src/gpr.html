<html lang="ja">
<head>

<link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">

<div id="stage"></div>
<!-- kit.js = 描画の小道具、gp-math.js = GPの計算、scenes-*.js = 場面の中身、engine.js = 時刻 t の絵にする加工機 -->
<script src="node_modules/katex/dist/katex.min.js"></script>
<script src="js/kit.js"></script>
<script src="js/gp-math.js"></script>
<!-- example-data.js = 第7章・第9章の例のデータ（想定質問の動画 faq.html と共通） -->
<script src="js/example-data.js"></script>
<!-- 同じ章の場面は読んだ順に並ぶ。第1章の全体像と多変量正規分布（scenes-intro.js）を、GP の定義（scenes-basic.js）より前に置く -->
<script src="js/scenes-intro.js"></script>
<script src="js/scenes-basic.js"></script>
<script src="js/scenes-kernel.js"></script>
<script src="js/scenes-categorical.js"></script>
<script src="js/scenes-matern.js"></script>
<!-- narration.js = 読み上げ原稿、narration/seconds.js = 声の長さ（voice で自動生成。無ければ字幕だけの動画） -->

<script src="narration/seconds.js"></script>
<script src="js/engine.js"></script>
